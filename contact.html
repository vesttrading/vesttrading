<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VestTrading - Contact Us</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg-dark: #0b1329;
            --primary-blue: #00f2fe;
            --primary-green: #00ff87;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(11, 19, 41, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 25px;
        }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: var(--primary-blue);
        }
        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ffffff, var(--primary-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .contact-form {
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 40px;
            text-align: left;
            margin-top: 40px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #ffffff;
            font-family: inherit;
            box-sizing: border-box;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary-blue);
            outline: none;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-blue), #0072ff);
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .submit-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <span style="color:var(--primary-blue)">Vest</span><span style="color:#ffffff">Trading</span>
        </a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#academy">Academy</a>
            <a href="forex.html">Forex</a>
            <a href="crypto.html">Crypto</a>
            <a href="ai-tools.html">AI Tools</a>
            <a href="contact.html" style="color: var(--primary-blue)">Contact</a>
        </nav>
    </header>
        <div class="container">
        <h1>Get in Touch</h1>
        <p style="color: var(--text-muted); font-size: 1.1rem;">Have questions about our AI models or platform features? Drop us a line.</p>
        
        <form class="contact-form" action="https://web3forms.com" method="POST">
            <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" required placeholder="Your name">
            </div>
            <div class="form-group">
                <label>Email</label>
               <input type="email" name="email" required placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea name="message" rows="5" required placeholder="How can we help you?"></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </div>

    <footer style="text-align: center; padding: 40px 20px; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 100px;">
        <div style="display: flex; justify-content: center; gap: 20px; margin-bottom: 15px;">
            <a href="#" target="_blank" style="font-size: 1.8rem; color: #0088cc; text-decoration: none;"><i class="fab fa-telegram"></i></a>
            <a href="#" target="_blank" style="font-size: 1.8rem; color: #25d366; text-decoration: none;"><i class="fab fa-whatsapp"></i></a>
            <a href="#" target="_blank" style="font-size: 1.8rem; color: #e1306c; text-decoration: none;"><i class="fab fa-instagram"></i></a>
            <a href="#" target="_blank" style="font-size: 1.8rem; color: #ff0000; text-decoration: none;"><i class="fab fa-youtube"></i></a>
            <a href="#" target="_blank" style="font-size: 1.8rem; color: #00f2fe; text-decoration: none;"><i class="fab fa-tiktok"></i></a>
        </div>
        <p style="color: #9ca3af; font-size: 0.9rem; margin: 0;">&copy; 2026 VestTrading. All rights reserved.</p>
    </footer>

</body>
</html>
