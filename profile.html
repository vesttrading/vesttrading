<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VestTrading - Client Portal</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg-dark: #0b1329;
            --primary-blue: #00f2fe;
            --primary-green: #00ff87;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(11, 19, 41, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 1.6rem; font-weight: 800; text-decoration: none; }
        .nav-links { display: flex; gap: 25px; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; transition: color 0.3s; }
        .nav-links a:hover { color: var(--primary-blue); }
        .auth-container { max-width: 400px; margin: 80px auto; padding: 30px; background: rgba(17, 24, 39, 0.8); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; }
        .auth-tabs { display: flex; justify-content: space-around; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .auth-tab { background: none; border: none; color: var(--text-muted); font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: color 0.3s; }
        .auth-tab.active { color: var(--primary-blue); }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #ffffff; box-sizing: border-box; }
        .form-group input:focus { border-color: var(--primary-blue); outline: none; }
        .auth-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary-blue), #0072ff); border: none; border-radius: 6px; color: #ffffff; font-weight: 700; cursor: pointer; }
        .dashboard { display: none; max-width: 1000px; margin: 40px auto; padding: 20px; }
        .db-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 30px; }
        .db-card { background: rgba(17, 24, 39, 0.8); border: 1px solid rgba(255,255,255,0.08); padding: 25px; border-radius: 10px; text-align: left; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <span style="color:var(--primary-blue)">Vest</span><span style="color:#ffffff">Trading</span>
        </a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="forex.html">Forex</a>
            <a href="crypto.html">Crypto</a>
            <a href="ai-tools.html">AI Tools</a>
            <a href="profile.html" style="color: var(--primary-blue)"><i class="fas fa-user"></i> Account</a>
        </nav>
    </header>

    <!-- Формы авторизации -->
    <div class="auth-container" id="authBox">
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchTab('login')">Sign In</button>
            <button class="auth-tab" onclick="switchTab('register')">Sign Up</button>
        </div>
     <form onsubmit="handleAuth(event)">
            <div class="form-group">
                <label id="userLabel">Email</label>
                <input type="email" required placeholder="name@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="auth-btn" id="mainAuthBtn">Login</button>
        </form>
    </div>

    <!-- Личный кабинет (скрыт до логина) -->
    <div class="dashboard" id="dashboardBox">
        <h2 style="text-align: left;">Welcome back, Trader!</h2>
        <div class="db-grid">
            <div class="db-card">
                <div style="color: var(--text-muted); font-size: 0.9rem;">Account Balance</div>
                <div style="font-size: 1.8rem; font-weight: 700; color: var(--primary-green); margin-top: 5px;">$14,250.00</div>
            </div>
            <div class="db-card">
                <div style="color: var(--text-muted); font-size: 0.9rem;">Active Signals</div>
                <div style="font-size: 1.8rem; font-weight: 700; color: var(--primary-blue); margin-top: 5px;">3 Available</div>
            </div>
            <div class="db-card">
                <div style="color: var(--text-muted); font-size: 0.9rem;">AI Market Status</div>
                <div style="font-size: 1.2rem; font-weight: 600; color: #ffffff; margin-top: 10px;"><i class="fas fa-robot"></i> Bullish Scan</div>
            </div>
        </div>
        <button onclick="logout()" style="margin-top: 30px; background: none; border: 1px solid rgba(255,255,255,0.2); color: #ffffff; padding: 10px 20px; border-radius: 6px; cursor: pointer;">Logout</button>
    </div>

    <script>
        let currentMode = 'login';
        function switchTab(mode) {
            currentMode = mode;
            document.querySelectorAll('.auth-tab').forEach(btn => btn.classList.remove('active'));
            if(mode === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('mainAuthBtn').innerText = 'Login';
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('mainAuthBtn').innerText = 'Register Account';
            }
        }
        function handleAuth(e) {
            e.preventDefault();
            document.getElementById('authBox').style.display = 'none';
            document.getElementById('dashboardBox').style.display = 'block';
        }
        function logout() {
            document.getElementById('dashboardBox').style.display = 'none';
            document.getElementById('authBox').style.display = 'block';
        }
    </script>
</body>
</html>
