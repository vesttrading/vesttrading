 <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VestTrading | Trade Smarter</title>
    <style>
        /* Общие стили и фон с графиком */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #020813;
            background-image: 
                radial-gradient(circle at 10% 80%, rgba(0, 242, 254, 0.15), transparent 40%),
                radial-gradient(circle at 90% 20%, rgba(184, 39, 252, 0.1), transparent 40%),
                linear-gradient(to top, rgba(2, 8, 19, 0.9), rgba(2, 8, 19, 0.6)),
                url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Шапка сайта */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(2, 8, 19, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Бирюзовый логотип VT */
        .logo span.vt {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-right: 8px;
            font-size: 28px;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        /* Обычные ссылки в меню без линий */
        nav a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            padding: 5px 0;
        }

        /* СОЧНО-ЗЕЛЕНОЕ СВЕЧЕНИЕ при наведении и нажатии */
        nav a:hover, nav a:active, nav a.active {
            color: #39ff14 !important; /* Насыщенный неоновый зеленый */
            text-shadow: 0 0 10px #39ff14, 0 0 20px #39ff14;
        }

      /* Контейнер для позиционирования меню */
.lang-container {
    position: relative;
    display: inline-block;
}

.lang-selector {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.05);
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    cursor: pointer;
    font-size: 14px;
    transition: all 0.3s ease;
}

.lang-selector:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: #39ff14; /* Подсветка зеленым при наведении */
}

.globe-icon {
    color: #00f2fe;
    font-size: 16px;
    display: flex;
    align-items: center;
}

/* Скрытое выпадающее меню */
.lang-dropdown {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 0px; /* Убрали зазор, подняли вплотную к глобусу */
    background: rgba(2, 8, 19, 0.98); /* Сделали фон плотнее */
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px; /* Сделали углы меню аккуратнее */
    min-width: 80px; /* Еще сильнее сузили меню */
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    z-index: 99999 !important;
    padding: 2px 0; /* Минимальный отступ внутри меню */
}

/* Ссылки на языки внутри меню */
.lang-dropdown a {
    display: block !important;
    color: rgba(255, 255, 255, 0.8) !important;
    padding: 2px 4px !important; /* Максимально сблизили кнопки друг к другу по вертикали */
    text-align: center; /* Текст снова ровно по центру */
    text-decoration: none !important;
    font-size: 13px; /* Слегка уменьшили шрифт для компактности */
    text-align: center;
    transition: all 0.2s ease;
    cursor: pointer !important;
}

/* СОЧНО-ЗЕЛЕНОЕ НЕОНОВОЕ СВЕЧЕНИЕ ПРИ НАВЕДЕНИИ */
.lang-dropdown a:hover {
    background: rgba(57, 255, 20, 0.2) !important;
    color: #39ff14 !important;
    text-shadow: 0 0 10px #39ff14, 0 0 20px #39ff14 !important;
}

/* Показываем меню при наведении на контейнер */
.lang-container:hover .lang-dropdown {
    display: block !important;
}

/* Невидимый мостик, чтобы меню гарантированно не исчезало при движении мыши */
.lang-container::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 0;
    width: 100%;
    height: 10px;
}
     .card {
    background: rgba(255, 255, 255, 0.03) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    transition: all 0.3s ease !important;
}
.card:nth-child(1):hover {
    border-color: #00f2fe !important;
    box-shadow: 0 0 20px rgba(0, 242, 254, 0.4) !important;
}
.card:nth-child(2):hover {
    border-color: #4facfe !important;
    box-shadow: 0 0 20px rgba(79, 172, 254, 0.4) !important;
}
.card:nth-child(3):hover {
    border-color: #b827fc !important;
    box-shadow: 0 0 20px rgba(184, 39, 252, 0.4) !important;
}
        /* Центральная часть (Hero) */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 120px 20px 40px 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 64px;
            font-weight: 800;
            margin: 0 0 10px 0;
            letter-spacing: -1px;
        }
             /* Бирюзовый подзаголовок Build Your Future. */
        .subtitle {
            font-size: 54px;
            font-weight: 800;
            margin: 0 0 25px 0;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            filter: drop-shadow(0 0 20px rgba(0, 242, 254, 0.2));
        }

        .description {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
            margin: 0 0 40px 0;
            max-width: 650px;
        }

        /* Контейнер для двух кнопок */
        .cta-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            width: 100%;
            max-width: 500px;
        }

        /* Стили интерактивных кнопок */
        .btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        /* Левая БИРЮЗОВАЯ градиентная кнопка (Academy) */
        .btn-primary {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #020813;
            border: none;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 242, 254, 0.7);
        }

        /* Правая контурная кнопка (AI Assistant) */
        .btn-secondary {
            background: rgba(2, 8, 19, 0.6);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(6px);
        }

        .btn-secondary:hover {
            border-color: #00f2fe;
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.2);
        }

        .btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Адаптивность под мобильные устройства */
        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            h1 { font-size: 42px; }
            .subtitle { font-size: 36px; }
            .description { font-size: 15px; }
            nav { display: none; }
            .cta-buttons { flex-direction: column; }
        }
    </style>
