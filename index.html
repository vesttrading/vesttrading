 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VestTrading | Trade Smarter</title>
  <style>
    /* Базовые стили */
    body {
      margin: 0;
      padding: 0;
      background: #000000;
      font-family: sans-serif;
      color: #ffffff;
      overflow-x: hidden;
    }

    #candles-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-color: #000000;
    }

    /* Навигация (Шапка сайта) */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      position: relative;
      z-index: 100;
    }

    .logo span {
      font-size: 32px;
      font-weight: bold;
      background: linear-gradient(135deg, #00f0ff, #3df2a0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Языковое меню */
    .lang-dropdown {
      position: relative;
      display: inline-block;
    }

    .lang-btn {
      background: transparent;
      border: 1px solid #1f2d3d;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .lang-btn:hover {
      border-color: #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }

    /* Главная секция */
    .main-container {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: flex-start !important;
      width: 100% !important;
      max-width: 1200px !important;
      margin: 0 auto !important;
      padding-top: 180px !important; /* Отступ под шапку сайта */
      position: relative !important;
      z-index: 10 !important;
    }

    .hero-title {
      color: #ffffff !important;
      font-size: 2.8rem !important;
      text-align: center !important;
      margin-top: 20px !important;
      margin-bottom: 10px !important;
    }

    .hero-subtitle {
      color: #00ffcc !important;
      font-size: 1.4rem !important;
      text-align: center !important;
    }

    /* Сетка карточек */
    .cards-container {
      display: flex !important;
      flex-wrap: wrap !important;
      justify-content: center !important;
      gap: 20px !important;
      width: 100% !important;
      max-width: 1000px !important;
      margin-top: 40px !important;
      padding: 20px !important;
      box-sizing: border-box !important;
    }

    /* Стили карточек */
    .card-item {
      flex: 1 !important;
      min-width: 240px !important;
      background-color: #0b132b !important;
      border: 1px solid #1f2d3d !important;
      border-radius: 8px !important;
      padding: 25px !important;
      text-align: center !important;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3) !important;
      transition: all 0.3s ease !important;
    }

    .card-item:hover {
      transform: translateY(-5px) !important;
    }

    .card-item:nth-child(1):hover { border-color: #3df2a0 !important; box-shadow: 0px 4px 15px rgba(61, 242, 160, 0.4) !important; }
    .card-item:nth-child(2):hover { border-color: #00f0ff !important; box-shadow: 0px 4px 15px rgba(0, 240, 255, 0.4) !important; }
    .card-item:nth-child(3):hover { border-color: #3df2a0 !important; box-shadow: 0px 4px 15px rgba(61, 242, 160, 0.4) !important; }

    .card-title {
      color: #ffffff !important;
      font-size: 1.4rem !important;
      margin: 10px 0 !important;
    }

    .card-desc {
      color: #a0aec0 !important;
      font-size: 1rem !important;
      margin: 0 !important;
    }

    /* Футер и кнопки соцсетей */
    .main-footer {
      width: 100% !important;
      text-align: center !important;
      padding: 60px 20px 40px 20px !important;
      margin-top: 50px !important;
      box-sizing: border-box !important;
    }
     .footer-socials {
      display: flex !important;
      flex-direction: row !important;
      flex-wrap: wrap !important;
      justify-content: center !important;
      gap: 20px !important;
      width: 100% !important;
      max-width: 600px !important;
      margin: 0 auto !important;
    }

    .social-link {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 12px 24px !important;
      background-color: #0b132b !important;
      border: 1px solid #1f2d3d !important;
      border-radius: 8px !important;
      color: #ffffff !important;
      text-decoration: none !important;
      font-size: 0.95rem !important;
      transition: all 0.3s ease !important;
      min-width: 120px !important;
    }

    .social-link:hover {
      color: #00ffcc !important;
      border-color: #00ffcc !important;
      transform: translateY(-2px) !important;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.3) !important;
    }
  </style>
</head>
<body>

  <!-- Анимированный фон -->
  <canvas id="candles-bg"></canvas>

  <!-- Верхняя панель навигации -->
  <header>
    <div class="logo">
      <span>VestTrading</span>
    </div>
    <div class="lang-dropdown">
      <button class="lang-btn">Español</button>
    </div>
  </header>

  <!-- Главный контент страницы -->
  <main class="main-container">
    <h1 data-lang="hero-title" class="hero-title">Opere de manera más inteligente.</h1>
    <p data-lang="hero-subtitle" class="hero-subtitle">Construya su futuro financiero.</p>

    <!-- Блок с карточками -->
    <div class="cards-container">
      
      <!-- Карточка 1 -->
      <div class="card-item">
        <h3 data-lang="card1-title" class="card-title">Market Analysis</h3>
        <p data-lang="card1-desc" class="card-desc">Detailed market analysis.</p>
      </div>

      <!-- Карточка 2 -->
      <div class="card-item">
        <h3 data-lang="card2-title" class="card-title">Trading Academy</h3>
        <p data-lang="card2-desc" class="card-desc">Comprehensive courses.</p>
      </div>

      <!-- Карточка 3 -->
      <div class="card-item">
        <h3 data-lang="card3-title" class="card-title">AI Assistant</h3>
        <p data-lang="card3-desc" class="card-desc">Smart trading tools.</p>
      </div>

    </div>
  </main>

  <!-- Нижняя панель (Футер) -->
  <footer class="main-footer">
    <div class="footer-socials">
      <a href="https://t.me" target="_blank" class="social-link">Telegram</a>
      <a href="https://wa.me" target="_blank" class="social-link">WhatsApp</a>
      <a href="https://instagram.com" target="_blank" class="social-link">Instagram</a>
    </div>
  </footer>

</body>
</html>
